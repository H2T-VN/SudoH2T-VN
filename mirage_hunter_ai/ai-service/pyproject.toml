[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miragehunter-ai-service"
version = "0.1.0"
description = "AI classification evaluation and adaptive failure hunting for H2T-MirageHunter"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "pydantic-settings==2.7.1",
    "uvicorn[standard]==0.34.0",
    "numpy>=1.26,<3",
    "Pillow>=10.4,<13",
    "optuna>=4.2,<6",
    "onnxruntime>=1.20,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
custom = ["onnx>=1.17,<2"]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "onnx>=1.17,<2",
    "nbformat>=5.10,<6",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
