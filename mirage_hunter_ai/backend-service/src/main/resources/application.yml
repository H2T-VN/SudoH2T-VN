server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: miragehunter-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/miragehunter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:miragehunter}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:3000}
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
